# Local production-like stack. Copy .env.example to .env and fill in values first.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: valden
      POSTGRES_PASSWORD: valden-local-only
      POSTGRES_DB: valden
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://valden:valden-local-only@db:5432/valden
    ports: ["3000:3000"]
    volumes: [uploads:/app/uploads]
    depends_on: [db]
volumes:
  pgdata:
  uploads:
